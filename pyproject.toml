[project]
name = "oci-runtime"
version = "0.5.0"
description = "Runtime-agnostic OCI container management with hexagonal architecture; owns the build-context locator for the dotfiles CLI toolchain"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oci_runtime"]

# The harness trees (.agents/, _bmad/, .opencode/, openspec/, tickets/) are not
# package content; keep them out of the sdist.
[tool.hatch.build.targets.sdist]
only-include = [
    "pyproject.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "src/oci_runtime",
    "tests",
]

[tool.uv.sources]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "docker_required: test requires Docker to be installed",
    "podman_required: test requires Podman to be installed",
    "runtime_required: test requires any container runtime (docker or podman)",
    "smoke: quick smoke test that proves the system works end-to-end",
    "functional: multi-step user workflow test",
    "slow: test that requires real CLI output or is slow to run",
]
